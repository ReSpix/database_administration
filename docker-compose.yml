services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/database
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
        DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/database"
    command: ["python", "-m", "backend.init_db"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: database_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-test:5432/database_test"
      INIT_DB_SCHEMA_ONLY: "1"
    command: ["python", "-m", "backend.init_db"]
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: "no"

  # sim:
  #   build:
  #     context: .
  #     dockerfile: generator/Dockerfile
  #   env_file: .env
  #   volumes:
  #     - ./logs:/app/logs
  #   # Uncomment to enable quick mode (10 sec, verbose):
  #   # environment:
  #   #   SIM_QUICK: "true"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  redis_data:
